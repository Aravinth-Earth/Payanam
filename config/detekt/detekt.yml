build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
     - 'ProjectStatisticsReport'
     - 'ComplexityReport'
     - 'NotificationReport'
     - 'FindingsReport'
     - 'FileBasedFindingsReport'

output-reports:
  active: true

# Enforced rule set for Payanam (FOSS contributor-grade documentation + safety).
# Scope: public API documentation and a small set of high-value safety/style rules.
# Broad complexity/naming/performance rules are intentionally NOT enabled to avoid
# requiring large refactors outside the KDoc-enforcement campaign.
#
# KDoc policy: require PURPOSE documentation on public classes and on public
# non-composable functions. Public properties and @Composable UI functions are
# exempt — their names and types are self-describing, and forcing docs on them
# produces name-restating noise (e.g. "/** Text. */") with no reader value.

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: false
    searchInInnerClass: false
    searchInInnerObject: false
    excludes: ['**/test/**', '**/androidTest/**', '**/*.Test.kt']
  UndocumentedPublicFunction:
    active: true
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/*.Test.kt']
  UndocumentedPublicProperty:
    active: false
    excludes: ['**/test/**', '**/androidTest/**']

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable']
    ignoreEnums: true
    ignoreNumbers: ['0', '1', '2']
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignorePropertyDeclaration: false
    ignoreNamedArgument: true
    ignoreRanges: true
    excludes: ['**/test/**', '**/androidTest/**']
