build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
     - 'ProjectStatisticsReport'
     - 'ComplexityReport'
     - 'NotificationReport'
     - 'FindingsReport'
     - 'FileBasedFindingsReport'

output-reports:
  active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: false
    searchInInnerClass: false
    searchInInnerObject: false
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 30
  LongMethod:
    active: true
    threshold: 100
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20

coroutines:
  active: true
  InjectDispatcher:
    active: true
    dispatcherNames:
      - 'IO'
      - 'Default'
      - 'Unconfined'

empty-blocks:
  active: true

exceptions:
  active: true
  PrintStackTrace:
    active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

naming:
  active: true
  ClassNaming:
    active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  EqualsWithHashCodeExist:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    comments:
      - 'FIXME:'
      - 'STOPSHIP:'
      - 'TODO:'
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable']
    ignoreEnums: true
    ignoreNumbers: ['0', '1', '2']
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignorePropertyDeclaration: false
    ignoreNamedArgument: true
    ignoreRanges: true
  MaxLineLength:
    active: true
    maxLineLength: 200
  ModifierOrder:
    active: true
  OptionalAbstractKeyword:
    active: true
  ReturnCount:
    active: true
    max: 10
    excludedFunctions:
      - 'equals'
  SafeCast:
    active: true
  WildcardImport:
    active: true