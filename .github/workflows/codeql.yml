# CodeQL code scanning — manual build steps for the Kotlin/Compose Android project.
# Default setup's autobuild cannot trace the multi-module Gradle build (Kotlin +
# Compose + KSP), so we build explicitly before analysis.
#
# SPDX-License-Identifier: AGPL-3.0-or-later
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "37 3 * * 1"

# Superseded pull-request runs are cancelled; pushes to `main` and the weekly
# scheduled run are left to finish so their results are not dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Pull requests read the cache only; the `dev` push run is the one that writes it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: "/language:${{matrix.language}}"
