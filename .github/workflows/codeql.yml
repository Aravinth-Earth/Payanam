# CodeQL code scanning — manual build steps for the Kotlin/Compose Android project.
# Default setup's autobuild cannot trace the multi-module Gradle build (Kotlin +
# Compose + KSP), so we build explicitly before analysis.
#
# SPDX-License-Identifier: AGPL-3.0-or-later
name: "CodeQL"

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "37 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
