appId: io.payanam
name: The exact-alarm affordance is gone once the permission is granted
tags:
  - manual
  - permissions
env:
  PASS: E2ETestPass!2026
---
# PRECONDITION: SCHEDULE_EXACT_ALARM must be ALLOWED for the app; this file is out of the default
# suite and is run BY FILE after:
#   adb shell appops set io.payanam SCHEDULE_EXACT_ALARM allow
# It is the second half of 06: with the app-op granted, Settings must not offer the row at all.
- launchApp:
    stopApp: false
# The focus-mode chooser can reappear on a relaunch; dismiss it if present.
- tapOn:
    id: "onboarding.focus_mode_continue_button"
    optional: true
- tapOn:
    id: "onboarding.primary_button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 30000
    optional: true
# Guarded: an already-unlocked app would turn the bare hideKeyboard into a Back press.
- runFlow:
    when:
      visible:
        id: "passphrase_unlock.passphrase_field"
    commands:
      - tapOn:
          id: "passphrase_unlock.passphrase_field"
      - inputText: "${PASS}"
      - hideKeyboard
      - tapOn:
          id: "passphrase_unlock.unlock_button"
# The unlock decrypts the database; nothing renders until it finishes.
- extendedWaitUntil:
    visible:
      id: "nav.tab.settings"
    timeout: 90000
- tapOn:
    id: "nav.tab.settings"
- scrollUntilVisible:
    element:
      id: "settings.debug_card"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 82-settings-with-permission
- assertNotVisible:
    id: "settings.reminders_card"
