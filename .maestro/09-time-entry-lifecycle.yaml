appId: io.payanam
name: Ending a tracking entry stops its notification, and Continue starts a new one
tags:
  - tracking
env:
  PASS: E2ETestPass!2026
  # Both shipped languages, as a regex; see 03-action-complete.yaml for why the values are grouped.
  LOC_START: "(Start|தொடங்கு)"
  LOC_CONTINUE: "(Continue|தொடர்)"
  TRACKING_SUBTEXT: "(Tracking in progress|கண்காணிப்பு நடைபெறுகிறது)"
---
# Covers #63: the tracking notification outlived a continued entry that was ended.
# The flow force-stops and relaunches the app itself, so it does not depend on what the previous flow
# left in front (an unsaved form, another tab, a running session).

- launchApp
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}
- extendedWaitUntil:
    visible:
      id: "nav.tab.time"
    timeout: 90000
- tapOn:
    id: "nav.tab.time"

- runFlow:
    file: subflows/stop-running-entry.yaml

- tapOn:
    id: "time.start_tracking_fab"
- extendedWaitUntil:
    visible: "^${LOC_START}$"
    timeout: 20000
# The start dialog's dimension picker is preselected, so Start is the whole interaction.
- tapOn: "^${LOC_START}$"
- extendedWaitUntil:
    visible:
      id: "time.stop_tracking_button"
    timeout: 30000
- takeScreenshot: 140-timer-running

# Stop Tracking opens the entry modal; End is its primary action.
- tapOn:
    id: "time.stop_tracking_button"
- extendedWaitUntil:
    visible:
      id: "edit_time_entry_confirm_button"
    timeout: 20000
- tapOn:
    id: "edit_time_entry_confirm_button"
- extendedWaitUntil:
    visible:
      id: "time.start_tracking_fab"
    timeout: 30000
- takeScreenshot: 141-entry-ended

# Continue the finished entry: it must produce a NEW entry, and ending that one must leave nothing
# running.
- tapOn:
    id: "time.entry_block"
- extendedWaitUntil:
    visible: "^${LOC_CONTINUE}$"
    timeout: 20000
- takeScreenshot: 142-continue-offered
- tapOn: "^${LOC_CONTINUE}$"
- extendedWaitUntil:
    visible:
      id: "time.stop_tracking_button"
    timeout: 30000
- tapOn:
    id: "time.stop_tracking_button"
- extendedWaitUntil:
    visible:
      id: "edit_time_entry_confirm_button"
    timeout: 20000
- tapOn:
    id: "edit_time_entry_confirm_button"
- extendedWaitUntil:
    visible:
      id: "time.start_tracking_fab"
    timeout: 30000
- takeScreenshot: 143-continued-entry-ended

# The ongoing notification is the user-visible half of the foreground service; the service read that
# proved it stopped was a shell job, so this flow asserts the half a user can see.
- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    notVisible: "${TRACKING_SUBTEXT}"
    timeout: 15000
- takeScreenshot: 144-shade-after-end
- pressKey: Back
