appId: ${APP_ID}
name: The permission warning follows whether a reminder will actually be armed
tags:
  - reminders
  - permissions
env:
  PASS: E2ETestPass!2026
  # Both shipped languages, as a regex; see 03-action-complete.yaml for why the values are grouped.
  NOTIF_TITLE: '(Turn on notifications\?|அறிவிப்புகளை இயக்கவா\?)'
  NOTIF_REMINDER_BODY: "(This reminder will not arrive, because notifications are turned off for Payanam.|இந்த நினைவூட்டல் வராது, ஏனெனில் பயணத்திற்கு அறிவிப்புகள் அடுத்தவும்.)"
  NOTIF_NOT_NOW: "(Not now|இப்போது இல்லை)"
---
# Covers #66. Notifications are pinned to denied and the due time is 12 minutes ahead, so:
#   Auto (15-minute default)  -> fire time already past -> no alarm -> no warning
#   Custom 0                  -> falls back to 15 minutes -> no alarm -> no warning
#   Custom 1                  -> fire time 11 minutes ahead -> alarm -> warning
# The flow ends by restoring notifications, so it does not leave the device unable to show them.

- evalScript: ${output.base = 'e2e-lead-' + Date.now(); output.due = new Date(Date.now() + 12*60000); output.dueHour = ('0'+output.due.getHours()).slice(-2); output.dueMinute = ('0'+output.due.getMinutes()).slice(-2)}

- launchApp:
    stopApp: true
    permissions:
      notifications: deny
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}
- extendedWaitUntil:
    visible:
      id: "nav.tab.tasks"
    timeout: 90000
- tapOn:
    id: "nav.tab.tasks"

# ---- Task 1: reminder mode Auto, due inside the 15-minute lead ----
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 30000
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${output.base}-auto"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
    timeout: 15000
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${output.dueHour}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${output.dueMinute}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 60000
# No alarm was armed, so no warning may be attributed to the missing permission.
- assertNotVisible: "${NOTIF_TITLE}"
- takeScreenshot: 160-auto-no-warning

# ---- Task 2: reminder mode Custom, 0 minutes ----
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${output.base}-zero"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
    timeout: 15000
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${output.dueHour}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${output.dueMinute}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"
- tapOn:
    id: "task_add.reminder_mode.custom"
- tapOn:
    id: "task_add.reminder_custom_minutes_field"
- eraseText
- inputText: "0"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 60000
- assertNotVisible: "${NOTIF_TITLE}"
- takeScreenshot: 161-zero-no-warning

# ---- Task 3: reminder mode Custom, 1 minute ----
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${output.base}-one"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
    timeout: 15000
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${output.dueHour}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${output.dueMinute}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"
- tapOn:
    id: "task_add.reminder_mode.custom"
- tapOn:
    id: "task_add.reminder_custom_minutes_field"
- eraseText
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"

# This save arms an alarm, so the dialog naming the loss must appear.
- extendedWaitUntil:
    visible: "${NOTIF_TITLE}"
    timeout: 30000
- assertVisible: "${NOTIF_REMINDER_BODY}"
- takeScreenshot: 162-one-warns
- tapOn: "${NOTIF_NOT_NOW}"
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 30000

# Restore the device state this flow changed: later flows need the shade.
- setPermissions:
    permissions:
      notifications: allow

# Task 3's 1-minute lead ARMED an alarm that would fire during a later flow, so the three tasks are
# archived (which cancels their reminders) instead of left behind. The warning dialog only appears
# while notifications are denied, hence the grant above comes first and this cleanup follows it.
- runFlow:
    file: subflows/archive-task.yaml
    env:
      TASK_NAME: ${output.base}-auto
- runFlow:
    file: subflows/archive-task.yaml
    env:
      TASK_NAME: ${output.base}-zero
- runFlow:
    file: subflows/archive-task.yaml
    env:
      TASK_NAME: ${output.base}-one
- takeScreenshot: 163-warning-cleanup
