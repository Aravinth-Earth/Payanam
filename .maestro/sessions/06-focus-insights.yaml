appId: io.payanam
name: Session — focus mode and insights visibility
tags:
  - session
env:
  PASS: E2ETestPass!2026
---
# Two settings that change what the rest of the app shows, each exercised as a user would: pick a
# focus-mode preset and watch the bottom bar lose the tabs it excludes, then restore the full suite;
# toggle one insights switch off and back on so the preference round-trips.
#
# Preconditions are the ones 01-fresh-setup establishes.

- launchApp
- runFlow:
    file: ../subflows/unlock.yaml
    env:
      PASS: ${PASS}
- extendedWaitUntil:
    visible:
      id: "nav.tab.settings"
    timeout: 90000
- tapOn:
    id: "nav.tab.settings"
- takeScreenshot: 700-session-start

# ---- preflight: auto-backup ON, or the epilogue has no Run-Backup-Now to tap. Settings is already this
# session's first destination, so the subflow's own nav tap re-selects the current tab and its
# scroll-back-to-top is what the focus-mode scroll below starts from.
- runFlow:
    file: ../subflows/ensure-auto-backup.yaml

# ---- focus mode: a preset that hides Tasks and Time ----
- scrollUntilVisible:
    element:
      id: "settings.focus_mode_card"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn:
    id: "settings.focus_mode_card"
- extendedWaitUntil:
    visible:
      id: "settings.focus.preset.simple_journal"
    timeout: 20000
- tapOn:
    id: "settings.focus.preset.simple_journal"
# The preset's own definition: journal, notes, lenses and settings stay; tasks and time go.
- extendedWaitUntil:
    notVisible:
      id: "nav.tab.tasks"
    timeout: 20000
- takeScreenshot: 701-focus-simple-journal

# ---- restore the full suite: every tab comes back ----
- tapOn:
    id: "settings.focus.preset.full_suite"
- extendedWaitUntil:
    visible:
      id: "nav.tab.tasks"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "nav.tab.time"
    timeout: 20000
- takeScreenshot: 702-focus-full-suite

# ---- insights: toggle the Journal module off and back on ----
# Module rows WITH children are expandable headers with no switch of their own; the Journal and Note
# modules are leaves, so their module switch is the one a user toggles.
- scrollUntilVisible:
    element:
      id: "settings.time_insights_card"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn:
    id: "settings.time_insights_card"
- scrollUntilVisible:
    element:
      id: "settings.insights.chart_journal_module_enabled"
    direction: DOWN
    timeout: 40000
    centerElement: true
# retryTapIfNoChange: the switch is a small target inside a long scrolling section, and a tap that
# lands while the list settles is a no-op — the second toggle of this pair silently did nothing on the
# first run and the verifier caught the preference left false.
- tapOn:
    id: "settings.insights.chart_journal_module_enabled"
    retryTapIfNoChange: true
- takeScreenshot: 703-insights-journal-off
- tapOn:
    id: "settings.insights.chart_journal_module_enabled"
    retryTapIfNoChange: true
- takeScreenshot: 704-insights-journal-on

# ---- epilogue: DB snapshot + current session log ----
- scrollUntilVisible:
    element:
      id: "settings.auto_backup_card"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn:
    id: "settings.auto_backup_card"
- scrollUntilVisible:
    element:
      id: "settings.run_backup_now"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "settings.run_backup_now"
# In-flight only: this tag is absent whenever no manual run is executing, so a re-run can never be
# satisfied by a stale node. Appearance proves the tap started a run; disappearance is the app's
# completion signal (the persisted "last run" line is still on screen from the previous run).
- extendedWaitUntil:
    visible:
      id: "settings.backup_in_progress"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "settings.backup_in_progress"
    timeout: 120000
- takeScreenshot: 705-backup-written
# The Debug card sits below the fold of the settings column: measured on the A17 it reported
# `[84,2039][996,2091]` — a 52 px sliver ending under the bottom bar — and a tap at y=2065 expanded
# nothing, so the export buttons inside it were never composed at all. Centring is what makes its row a
# real target (the same class as `settings.auto_backup_switch` above).
- scrollUntilVisible:
    element:
      id: "settings.debug_card"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn:
    id: "settings.debug_card"
- extendedWaitUntil:
    visible:
      id: "log_export.export_latest_button"
    timeout: 20000
# The card's LAST row, composed only while it is expanded: centre it rather than trust the expansion to
# have left it inside the viewport.
- scrollUntilVisible:
    element:
      id: "log_export.export_latest_button"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "log_export.export_latest_button"
- takeScreenshot: 706-log-export-tapped
