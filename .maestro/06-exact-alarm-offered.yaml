appId: io.payanam
name: The exact-alarm affordance appears only when the permission is missing
tags:
  - manual
  - permissions
env:
  PASS: E2ETestPass!2026
---
# PRECONDITION: SCHEDULE_EXACT_ALARM must be DENIED for the app. An app-op is OS state that no flow
# can set, so this file is out of the default suite and is run BY FILE after:
#   adb shell appops set io.payanam SCHEDULE_EXACT_ALARM deny
# With the app-op denied, Settings shows the Reminders card and its row opens the system screen that
# grants it. The follow-up (row gone, pending reminders re-armed) is flow 07, which needs the grant.
- launchApp
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 60000
- tapOn:
    id: "passphrase_unlock.passphrase_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "passphrase_unlock.unlock_button"
# The unlock decrypts the database; nothing renders until it finishes.
- extendedWaitUntil:
    visible:
      id: "nav.tab.settings"
    timeout: 60000
- tapOn:
    id: "nav.tab.settings"
- scrollUntilVisible:
    element:
      id: "settings.reminders_card"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: "settings.reminders_card"
- extendedWaitUntil:
    visible:
      id: "settings.exact_alarm_row"
- takeScreenshot: 80-exact-alarm-row-visible
- tapOn:
    id: "settings.exact_alarm_row"
# The system screen owns the toggle; this only proves the app sent the user there.
- takeScreenshot: 81-system-exact-alarm-screen
