appId: io.payanam
name: Reminder Miss reaches the DB after the passphrase unlock
---
# Miss tapped on the dead-process reminder is applied after the passphrase unlock: the
# habit's TODAY cell reads the build's missed word. Miss exists only on a HABIT
# reminder, so the task must be recurring; the runner sets the due 22 min ahead.

# killApp is `am kill`, which only kills BACKGROUND processes: Home first.
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
# Cold start after the kill: the unlock screen comes up before the database opens.
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 60000
- tapOn:
    id: "passphrase_unlock.passphrase_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "passphrase_unlock.unlock_button"
# The unlock decrypts the database; nothing renders until it finishes.
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 60000
- tapOn:
    id: "nav.tab.habits"

- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${HABIT_NAME}"
- hideKeyboard

# Recurring is what makes Miss exist at all on the reminder.
- tapOn:
    id: "task_add.task_type.recurring"
- extendedWaitUntil:
    visible:
      id: "recurrence.confirm_button"
- tapOn:
    id: "recurrence.preset.daily"
    optional: true
- tapOn:
    id: "recurrence.confirm_button"

- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${DUE_HOUR}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${DUE_MINUTE}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"

# Reminder mode stays at its default (auto) = 15 min before the due time.
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
- takeScreenshot: 140-habit-created

- pressKey: Home
- killApp
- takeScreenshot: 141-app-closed
- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "${HABIT_NAME}"
    timeout: ${REMINDER_WAIT_MS}
- takeScreenshot: 142-reminder-in-shade

- tapOn:
    text: "${ACTION_EXPAND}"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "${ACTION_MISS}"
- tapOn: "${ACTION_MISS}"
- takeScreenshot: 143-action-tapped

- launchApp:
    stopApp: false
# Cold start after the action tap: the killed app reopens at the unlock screen.
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 60000
- tapOn:
    id: "passphrase_unlock.passphrase_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "passphrase_unlock.unlock_button"
# Decrypt plus the queued Miss write; the list renders after both.
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 90000
- tapOn:
    id: "nav.tab.habits"

# The list accumulates a habit per run, so this flow's row may be below the fold.
- scrollUntilVisible:
    element:
      text: "${HABIT_NAME}, .*"
    direction: DOWN
    timeout: 60000

# (1) TODAY's cell now carries a status at all: PENDING/UNKNOWN render as the
#     not-filled word, so any other word means an occurrence row exists for today.
- extendedWaitUntil:
    visible: "${HABIT_NAME}, ${TODAY}, .*"
- takeScreenshot: 144-today-cell-written

# (2) That status is MISSED. The receiver passes a status string to one shared
#     handler, so Miss writing "skipped" is a real failure mode (1) cannot see.
- assertVisible: "${HABIT_NAME}, ${TODAY}, ${STATUS_MISSED}"
- takeScreenshot: 145-today-cell-missed
