appId: io.payanam
name: Miss on a dead-process habit reminder writes the missed status after the unlock
tags:
  - reminders
env:
  PASS: E2ETestPass!2026
  # Both shipped languages, as a regex; see 03-action-complete.yaml for why the values are grouped.
  ACTION_EXPAND: "(Expand|விரிவாக்கும்)"
  ACTION_MISS: "(Miss|தவறவிட்டது)"
  STATUS_MISSED: "(Missed|தவறவிட்டது)"
---
# Miss tapped on the dead-process reminder is applied after the passphrase unlock: the habit's today
# cell reads the build's missed word. Miss exists only on a HABIT reminder, so the task is recurring.
# Preconditions: the app is provisioned with PASS and SCHEDULE_EXACT_ALARM is allowed.

- evalScript: ${output.habit = 'e2e-miss-' + Date.now(); output.due = new Date(Date.now() + 22*60000); output.dueHour = ('0'+output.due.getHours()).slice(-2); output.dueMinute = ('0'+output.due.getMinutes()).slice(-2)}

# A force-stop start, not `am kill`: a graceful kill lets Android restore the last destination on
# relaunch (a form left open by an earlier flow), and this flow needs a clean list. The `am kill`
# that matters is the one below, after the reminder is armed.
- launchApp
# Cold start: the unlock screen comes up before the database opens.
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}

- runFlow:
    file: subflows/create-habit-with-reminder.yaml
    env:
      HABIT_NAME: ${output.habit}
      DUE_HOUR: ${output.dueHour}
      DUE_MINUTE: ${output.dueMinute}
- takeScreenshot: 140-habit-created

- pressKey: Home
- killApp
- takeScreenshot: 141-app-closed

- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "${output.habit}"
    timeout: 480000
- takeScreenshot: 142-reminder-in-shade

- tapOn:
    text: "${ACTION_EXPAND}"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "${ACTION_MISS}"
- tapOn: "${ACTION_MISS}"
- takeScreenshot: 143-action-tapped

- launchApp:
    stopApp: false
# Cold start after the action tap: the killed app reopens at the unlock screen.
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}
# Decrypt plus the queued Miss write; the list renders after both.
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 90000
- tapOn:
    id: "nav.tab.habits"

# The list accumulates a habit per run, so this flow's row may be below the fold.
- scrollUntilVisible:
    element:
      text: ".*${output.habit}.*"
    direction: DOWN
    timeout: 60000

# (1) Today's cell now carries a status at all: PENDING/UNKNOWN render as the not-filled word, so
#     any other word means an occurrence row exists for today.
- extendedWaitUntil:
    visible: ".*${output.habit}.*"
- takeScreenshot: 144-today-cell-written

# (2) That status is MISSED. The receiver passes a status string to one shared handler, so Miss
#     writing "skipped" is a real failure mode (1) cannot see.
- assertVisible: ".*${output.habit}.*${STATUS_MISSED}.*"
- takeScreenshot: 145-today-cell-missed
