appId: ${APP_ID}
name: Complete on a dead-process reminder reaches the database after the unlock
tags:
  - reminders
env:
  PASS: E2ETestPass!2026
  # Labels come from the app's own copy, so every value carries BOTH shipped languages
  # (core/strings values/ and values-ta/) and is a regular expression; parentheses keep the
  # alternation safe when a flow composes two values into one matcher. Override with -e for any
  # other locale.
  ACTION_EXPAND: "(Expand|விரிவாக்கும்)"
  ACTION_COMPLETE: "(Complete|முடி)"
---
# Complete tapped on the dead-process reminder is applied after the passphrase unlock.
# The reminder fires 15 min before the due time and delivery can slip without SCHEDULE_EXACT_ALARM,
# so the shade wait is generous. Preconditions: the app is provisioned with PASS and
# SCHEDULE_EXACT_ALARM is allowed (see .maestro/README.md; the flow cannot set an app-op).
#
# The row is a ONE-TIME task, not a habit: completing a habit advances its recurrence to the next day
# and the user's "Hide completed today" preference can hide it, so neither the row nor its today cell
# is assertable afterwards. A completed task keeps its place and moves to the Completed filter, which
# is what proves the write landed.

# One task name and one due time per run: a re-run under the same name would match the previous
# run's row. The due time is computed on the host, so the host and device clocks must agree.
- evalScript: ${output.task = 'e2e-complete-' + Date.now(); output.due = new Date(Date.now() + 22*60000); output.dueHour = ('0'+output.due.getHours()).slice(-2); output.dueMinute = ('0'+output.due.getMinutes()).slice(-2)}

# A force-stop start, not `am kill`: a graceful kill lets Android restore the last destination on
# relaunch (a form left open by an earlier flow), and this flow needs a clean list. The `am kill`
# that matters is the one below, after the reminder is armed.
# Home first: a run that failed inside the notification shade leaves it open, and a launched activity
# behind it never becomes addressable.
- pressKey: Home
- launchApp
# Cold start: the unlock screen comes up before the database opens.
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}

- runFlow:
    file: subflows/create-task-with-reminder.yaml
    env:
      TASK_NAME: ${output.task}
      DUE_HOUR: ${output.dueHour}
      DUE_MINUTE: ${output.dueMinute}
- takeScreenshot: 110-task-created

- pressKey: Home
- killApp
- takeScreenshot: 111-app-closed

- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "${output.task}"
    timeout: 480000
- takeScreenshot: 112-reminder-in-shade

- tapOn:
    text: "${ACTION_EXPAND}"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "${ACTION_COMPLETE}"
- tapOn: "${ACTION_COMPLETE}"
- takeScreenshot: 113-action-tapped

# The activity opens itself on the action tap; its cold start precedes the unlock.
- launchApp:
    stopApp: false
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}
# Decrypt plus the queued Complete write; the list renders after both.
- extendedWaitUntil:
    visible:
      id: "nav.tab.tasks"
    timeout: 90000
- tapOn:
    id: "nav.tab.tasks"

# The Completed filter is the assertion: a task that is only marked, never completed, cannot appear
# under it. Chips are addressed by tag (the row's own "Completed" marker would match the copy too) and
# Completed lives on the Not Active layer.
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 30000
- tapOn:
    id: "tasks.filter.all"
- tapOn:
    id: "tasks.filter.not_active"
- tapOn:
    id: "tasks.filter.completed"
- scrollUntilVisible:
    element:
      text: ".*${output.task}.*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 115-complete-verified
