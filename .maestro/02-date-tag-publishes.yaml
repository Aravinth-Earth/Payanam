appId: io.payanam
name: The date dialog confirm button is reachable by id
---
# Regression guard for a tag that compiled, linted and did nothing: the confirm
# button lives in a material3 DatePickerDialog, which draws in its own window.
- launchApp
# Cold start: the app boots to the unlock screen before the database opens.
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 60000
- tapOn:
    id: "passphrase_unlock.passphrase_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "passphrase_unlock.unlock_button"
# The unlock decrypts the database; nothing renders until it finishes.
- extendedWaitUntil:
    visible:
      id: "nav.tab.tasks"
    timeout: 60000
- tapOn:
    id: "nav.tab.tasks"
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
- tapOn:
    id: "tasks.add_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_date_button"
- tapOn:
    id: "task_add.due_date_button"
# Fails here if the dialog does not publish its tags.
- extendedWaitUntil:
    visible:
      id: "task_add.due_date_confirm_button"
- takeScreenshot: 60-date-confirm-visible
- tapOn:
    id: "task_add.due_date_confirm_button"
- takeScreenshot: 61-date-confirmed
