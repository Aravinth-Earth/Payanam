appId: io.payanam
name: The More action opens the task status dialog and writes nothing
---
# More tapped on the dead-process reminder opens the app at the unlock screen, then the task
# detail with the status dialog. Dismissing it must leave today's cell unwritten.
# The reminder fires 15 min before the due time (the runner sets the due 22 min ahead).

# killApp is `am kill`, which only kills BACKGROUND processes: Home first.
- pressKey: Home
- killApp
- launchApp
# Cold start after the kill: the unlock screen comes up before the database opens.
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 60000
- tapOn:
    id: "passphrase_unlock.passphrase_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "passphrase_unlock.unlock_button"
# The unlock decrypts the database; nothing renders until it finishes.
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 60000
- tapOn:
    id: "nav.tab.habits"

- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${HABIT_NAME}"
- hideKeyboard

# Recurring makes it a habit; DAILY is preselected in the rule dialog.
- tapOn:
    id: "task_add.task_type.recurring"
- extendedWaitUntil:
    visible:
      id: "recurrence.confirm_button"
- tapOn:
    id: "recurrence.preset.daily"
    optional: true
- tapOn:
    id: "recurrence.confirm_button"

# Due time by keyboard: the dial has no addressable elements.
- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${DUE_HOUR}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${DUE_MINUTE}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"

# Reminder mode stays at its default (auto) = 15 min before the due time.
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"
# The save is async and the bottom bar is visible on the add form too, so wait for the
# list's own add action before Home + killApp can interrupt the write and the arming.
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 60000
- takeScreenshot: 110-habit-created

- pressKey: Home
- killApp
- takeScreenshot: 111-app-closed

- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "${HABIT_NAME}"
    timeout: ${REMINDER_WAIT_MS}
- takeScreenshot: 112-reminder-in-shade

- tapOn:
    text: "${ACTION_EXPAND}"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "${ACTION_MORE}"
- tapOn: "${ACTION_MORE}"
- takeScreenshot: 123-more-tapped

# The activity opens itself on the action tap; its cold start precedes the unlock.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "passphrase_unlock.passphrase_field"
    timeout: 60000
- tapOn:
    id: "passphrase_unlock.passphrase_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "passphrase_unlock.unlock_button"
# Decrypt, then the queued More opens the task detail and its status dialog.
- extendedWaitUntil:
    visible:
      id: "status_note.dialog"
    timeout: 90000
- takeScreenshot: 124-more-status-dialog

# Back dismisses the dialog without confirming it, so no status write is issued.
- pressKey: Back
- assertNotVisible:
    id: "status_note.dialog"
# Back again leaves the detail screen for the tab the deep link opened over.
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 60000
- tapOn:
    id: "nav.tab.habits"

# The row and its today cell must be on screen, or the negative below cannot fail.
- scrollUntilVisible:
    element:
      text: "${HABIT_NAME}, .*"
    direction: DOWN
    timeout: 60000
- assertVisible: "${HABIT_NAME}, ${TODAY}, .*"
# More only opens the dialog: today's cell must carry no status word at all.
- assertNotVisible: "${HABIT_NAME}, ${TODAY}, (${STATUS_COMPLETED}|${STATUS_SKIPPED}|${STATUS_MISSED})"
- takeScreenshot: 125-more-wrote-nothing
