appId: io.payanam
name: More on a dead-process reminder opens the status dialog and writes nothing
tags:
  - reminders
env:
  PASS: E2ETestPass!2026
  # Both shipped languages, as a regex; see 03-action-complete.yaml for why the values are grouped.
  ACTION_EXPAND: "(Expand|விரிவாக்கும்)"
  ACTION_MORE: "(More|மேலும்)"
  STATUS_COMPLETED: "(Completed|முடிக்கப்பட்டது)"
  STATUS_SKIPPED: "(Skipped|தவிர்க்கப்பட்டது)"
  STATUS_MISSED: "(Missed|தவறவிட்டது)"
---
# More tapped on the dead-process reminder opens the app at the unlock screen, then the task detail
# with the status dialog. Dismissing it must leave today's cell unwritten.
# Preconditions: the app is provisioned with PASS and SCHEDULE_EXACT_ALARM is allowed.

- evalScript: ${output.habit = 'e2e-more-' + Date.now(); output.due = new Date(Date.now() + 22*60000); output.dueHour = ('0'+output.due.getHours()).slice(-2); output.dueMinute = ('0'+output.due.getMinutes()).slice(-2)}

# A force-stop start, not `am kill`: a graceful kill lets Android restore the last destination on
# relaunch (a form left open by an earlier flow), and this flow needs a clean list. The `am kill`
# that matters is the one below, after the reminder is armed.
- launchApp
# Cold start: the unlock screen comes up before the database opens.
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}

- runFlow:
    file: subflows/create-habit-with-reminder.yaml
    env:
      HABIT_NAME: ${output.habit}
      DUE_HOUR: ${output.dueHour}
      DUE_MINUTE: ${output.dueMinute}
- takeScreenshot: 120-habit-created

- pressKey: Home
- killApp
- takeScreenshot: 121-app-closed

- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "${output.habit}"
    timeout: 480000
- takeScreenshot: 122-reminder-in-shade

- tapOn:
    text: "${ACTION_EXPAND}"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "${ACTION_MORE}"
- tapOn: "${ACTION_MORE}"
- takeScreenshot: 123-more-tapped

# The activity opens itself on the action tap; its cold start precedes the unlock.
- launchApp:
    stopApp: false
- runFlow:
    file: subflows/unlock.yaml
    env:
      PASS: ${PASS}
# Decrypt, then the queued More opens the task detail and its status dialog.
- extendedWaitUntil:
    visible:
      id: "status_note.dialog"
    timeout: 90000
- takeScreenshot: 124-more-status-dialog

# Back dismisses the dialog without confirming it, so no status write is issued.
- pressKey: Back
- assertNotVisible:
    id: "status_note.dialog"
# Back again leaves the detail screen for the tab the deep link opened over.
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 60000
- tapOn:
    id: "nav.tab.habits"

# The row and its today cell must be on screen, or the negative below cannot fail.
- scrollUntilVisible:
    element:
      text: ".*${output.habit}.*"
    direction: DOWN
    timeout: 60000
- assertVisible: ".*${output.habit}.*"
# More only opens the dialog: today's cell must carry no status word at all.
- assertNotVisible: ".*${output.habit}.*(${STATUS_COMPLETED}|${STATUS_SKIPPED}|${STATUS_MISSED})"
- takeScreenshot: 125-more-wrote-nothing
