appId: io.payanam
---
# Creates a recurring habit (a "habit" is a task with a recurrence rule) whose reminder is meant to
# fire a few minutes from now. Env the caller must set: HABIT_NAME, DUE_HOUR, DUE_MINUTE — the caller
# computes the due time, because how far ahead it must be depends on how long its own wait is.
# Ends on the Habits list with the save committed (the list's add action is back).
# A form left open by an earlier flow survives even a process kill (Android restores the last
# destination), and tapping a tab does not dismiss it: close it first.
- runFlow:
    when:
      visible:
        id: "task_add.title_field"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: "nav.tab.habits"
    timeout: 90000
- tapOn:
    id: "nav.tab.habits"

- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 30000
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${HABIT_NAME}"
- hideKeyboard

# Recurring is what makes the reminder's Miss action exist at all.
- tapOn:
    id: "task_add.task_type.recurring"
- extendedWaitUntil:
    visible:
      id: "recurrence.confirm_button"
- tapOn:
    id: "recurrence.preset.daily"
    optional: true
- tapOn:
    id: "recurrence.confirm_button"

# Due time by keyboard: the dial has no addressable elements.
- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${DUE_HOUR}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${DUE_MINUTE}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"

# Reminder mode stays at its default (auto) = 15 min before the due time.
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"
# The save is async and the bottom bar is visible on the add form too, so wait for the list's own add
# action before a caller's Home + killApp can interrupt the write and the arming.
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 60000
