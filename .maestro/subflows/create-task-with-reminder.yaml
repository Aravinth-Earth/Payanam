appId: io.payanam
---
# Creates a ONE-TIME task whose reminder is meant to fire a few minutes from now. The due DATE keeps
# the form's default (today) and a one-time task does not advance, so after the action the row is
# still in the list and its status is assertable — unlike a habit, which advances to the next
# occurrence and can be hidden by the user's "Hide completed today" preference.
# Env the caller must set: TASK_NAME, DUE_HOUR, DUE_MINUTE. Ends on the Tasks list with the save
# committed (the list's own add action is back).
# A form left open by an earlier flow survives even a process kill (Android restores the last
# destination), and tapping the tab that is already selected does not dismiss it: close it first.
- runFlow:
    when:
      visible:
        id: "task_add.title_field"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: "nav.tab.tasks"
    timeout: 90000
- tapOn:
    id: "nav.tab.tasks"

- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 30000
- tapOn:
    id: "tasks.add_button"
- tapOn:
    id: "task_add.title_field"
- inputText: "${TASK_NAME}"
- hideKeyboard

# Due time by keyboard: the dial has no addressable elements.
- tapOn:
    id: "task_add.due_time_button"
- extendedWaitUntil:
    visible:
      id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_input_toggle"
- tapOn:
    id: "task_add.due_time_hour_field"
- eraseText
- inputText: "${DUE_HOUR}"
- tapOn:
    id: "task_add.due_time_minute_field"
- eraseText
- inputText: "${DUE_MINUTE}"
- hideKeyboard
- tapOn:
    id: "task_add.due_time_confirm_button"

# Reminder mode stays at its default (auto) = 15 min before the due time.
- scrollUntilVisible:
    element:
      id: "task_add.save_button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task_add.save_button"
# The save is async and the bottom bar is visible on the add form too, so wait for the list's own add
# action before a caller's Home + killApp can interrupt the write and the arming.
- extendedWaitUntil:
    visible:
      id: "tasks.add_button"
    timeout: 60000
