appId: ${APP_ID}
name: Fresh setup — onboarding, passphrase, dimensions, debug logging
tags:
  - setup
  - destructive
env:
  PASS: E2ETestPass!2026
---
# clearState is `pm clear` on the installed app, so this flow destroys the real database. It is
# excluded from the workspace's default flow list (.maestro/config.yaml) for that reason: run it BY
# FILE, only against an install you are willing to wipe.
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- takeScreenshot: 01-launch

# Onboarding tour: one primary button advances each slide. Optional taps poll from the
# last successful interaction, so wait for the button first or the tour stays on page 1.
- extendedWaitUntil:
    visible:
      id: "onboarding.primary_button"
    timeout: 30000
- repeat:
    times: 4
    commands:
      - tapOn:
          id: "onboarding.primary_button"
          optional: true
- takeScreenshot: 02-after-onboarding

# Focus-mode chooser (a preset is preselected).
- tapOn:
    id: "onboarding.focus_mode_continue_button"
    optional: true
- takeScreenshot: 03-focus-mode

# Cold start with a cleared state: this wait covers the first database build.
- extendedWaitUntil:
    visible:
      id: "db_init.create_database_button"
    timeout: 30000
- tapOn:
    id: "db_init.create_database_button"
- takeScreenshot: 04-db-gate

# Passphrase setup (create form).
- extendedWaitUntil:
    visible:
      id: "db_init.passphrase_field"
- tapOn:
    id: "db_init.passphrase_field"
- inputText: "${PASS}"
- tapOn:
    id: "db_init.passphrase_confirm_field"
- inputText: "${PASS}"
- hideKeyboard
- tapOn:
    id: "db_init.passphrase_submit_button"
- takeScreenshot: 05-passphrase-submitted

# Dimension step loads its list first; the continue button appears after.
- extendedWaitUntil:
    visible:
      id: "db_init.dimension_setup_continue_button"
    timeout: 45000
- takeScreenshot: 06-dimensions-loaded
- tapOn:
    id: "db_init.dimension_setup_continue_button"
- takeScreenshot: 07-dimensions-continued

# First run goes into the app and seeds the DB; the gate locks on the next launch.
- extendedWaitUntil:
    visible:
      id: "nav.tab.settings"
    timeout: 90000
- takeScreenshot: 08-main-ui

# Debug logging FIRST, so the whole run lands in the session log.
- tapOn:
    id: "nav.tab.settings"
# Measured on the A17: this scroll reported `[84,2039][996,2091]` for the card — a 52 px sliver under the
# bottom bar — and the following tap expanded nothing, so the debug switch and the export buttons were
# never composed. Centring is what makes the header a real target.
- scrollUntilVisible:
    element:
      id: "settings.debug_card"
    direction: DOWN
    timeout: 40000
    centerElement: true
- takeScreenshot: 09-settings
- tapOn:
    id: "settings.debug_card"
- extendedWaitUntil:
    visible:
      id: "settings.debug_logging_switch"
- takeScreenshot: 10-debug-card
# Only when it is off: a debug build starts with logging on, and an unconditional tap turns it off.
- runFlow:
    file: subflows/setup-debug-logging.yaml
- takeScreenshot: 11-debug-on

# Auto-Backup ON, once per install. Sessions rely on it for the DB snapshot they export, and a fresh
# install always starts with it off. Enabling it also writes the first backup immediately.
- scrollUntilVisible:
    element:
      id: "settings.auto_backup_card"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn:
    id: "settings.auto_backup_card"
- extendedWaitUntil:
    visible:
      id: "settings.auto_backup_switch"
    timeout: 20000
# The switch row is the last thing in the card and sat exactly on the measured edge (`[84,2059][996,2091]`
# against a viewport ending at 2052): the tap landed at (540,2075) on dead space and the app logged no
# toggle. Scroll the ROW to the middle before tapping it — the same shape as
# `subflows/ensure-auto-backup.yaml`, which is the proven fix for this site.
- scrollUntilVisible:
    element:
      id: "settings.auto_backup_switch"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "settings.auto_backup_switch"
# Run-now renders only while Auto-Backup is on, so this is also the toggle's own assertion.
# Below the fold once the card is open: scroll rather than wait, or a taller card never passes.
- scrollUntilVisible:
    element:
      id: "settings.run_backup_now"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 12-auto-backup-on
