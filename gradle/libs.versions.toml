[versions]
agp = "9.3.0"
kotlin = "2.3.20"
ksp = "2.3.10"
hilt = "2.59.2"
room = "2.7.2"
compose-bom = "2026.02.01"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.9.7"
# The multiplatform navigation artifact. Pinned to the release whose transitive lifecycle (2.9.6) and
# savedstate (1.3.6) are the exact versions Compose Multiplatform 1.10.2 resolves, so the shared graph and
# the platform Compose runtime agree on one lifecycle.
navigation-multiplatform = "2.9.2"
core-ktx = "1.18.0"
coroutines = "1.10.2"
material3 = "1.3.1"
junit = "4.13.2"
junit-ext = "1.3.0"
espresso = "3.7.0"
timber = "5.0.1"
datastore = "1.2.1"
workmanager = "2.11.1"
biometric = "1.1.0"
vico = "3.1.0"
truth = "1.4.5"
robolectric = "4.16.1"
androidx-test-core = "1.7.0"
mockito-core = "5.23.0"
mockito-kotlin = "5.4.0"
detekt = "1.23.8"
ktlint = "1.8.0"
spotless = "8.4.0"
sqlcipher = "4.17.0"
serialization = "1.9.0"
compose-multiplatform = "1.10.2"
sqlite-jdbc = "3.50.3.0"
# JVM SQLCipher JDBC driver for the desktop app (reads Android-exported encrypted DBs).
# Verified on Maven Central, Apache-2.0, and proven against a real export. NOTE: NOT
# net.zetetic:sqlcipher-android — that artifact is Android-only and cannot run on the JVM.
sqlcipher-jvm = "0.2.13"

[libraries]
# Core Android
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Activity & Lifecycle
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# Compose Multiplatform navigation: the same NavHost/composable/navArgument API on every target, so the
# navigation graph itself can live in :core:ui instead of being re-declared per platform.
navigation-compose-multiplatform = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigation-multiplatform" }

# Room Database
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# room-common-jvm: the KMP JVM artifact carrying the Room annotations (Entity, ColumnInfo, Query...).
# Room 2.7.x is multiplatform, so this is a plain JAR — usable from a kotlin.jvm module, unlike
# room-runtime which is Android-only (room-runtime-android). Verified: the JAR contains
# androidx/room/{Entity,ColumnInfo,PrimaryKey,Query,RawQuery}.class and pulls only
# androidx.annotation + kotlin-stdlib transitively.
room-common-jvm = { group = "androidx.room", name = "room-common-jvm", version.ref = "room" }

# Hilt Dependency Injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.3.0" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Supplies Dispatchers.Main on the JVM/Swing side. Skewed versions against coroutines-core are a
# documented failure mode of the missing-Main-dispatcher error, so this shares the version ref.
coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Vico Charts
# Vico 3.x ships no `core` artifact: `compose` is the multiplatform module and carries the
# com.patrykandpatrick.vico.core packages as com.patrykandpatrick.vico.compose ones.
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito-core" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite-jdbc" }
# Desktop-only JVM SQLCipher driver. The core artifact has no natives; the per-platform artifact
# carries them, so exactly one must be selected by host OS in desktop/build.gradle.kts (declaring
# both would add ~15-20 MB of unusable natives to every build, since Gradle resolves every
# declared dependency).
sqlcipher-jvm-jdbc = { group = "io.github.s0d3s", name = "sqlcipher-multiplatform-jdbc-core", version.ref = "sqlcipher-jvm" }
sqlcipher-jvm-linux-x64 = { group = "io.github.s0d3s", name = "sqlcipher-multiplatform-jdbc-linux-x64", version.ref = "sqlcipher-jvm" }
sqlcipher-jvm-windows-x64 = { group = "io.github.s0d3s", name = "sqlcipher-multiplatform-jdbc-windows-x64", version.ref = "sqlcipher-jvm" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 replaced com.android.library for KMP modules: the old plugin is rejected outright when
# org.jetbrains.kotlin.multiplatform is applied. This is the supported plugin for a module that is
# BOTH an Android library and a multiplatform module (:core:ui).
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
